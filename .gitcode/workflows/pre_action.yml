name: pre_action

on:
  workflow_call:
  
    
jobs:
  JOB_pr:
    permissions:
      repository: read
      id-token: write
    name: PreBuild_get-pr
    steps:
      -
        name: Checkout
        identifier: process_checkout
        uses: checkout
        with:
          ref: ${{ atomgit.event.pull_request.merge_commit_sha }}
          allow-unsafe-pr-checkout: true
          token: ${{secrets.GIT_TOKEN}}
      -
        name: get_pr
        identifier: get_pr
        uses: cann/.gitcode/actions/get-pr@master
        with:
          workspace: ${{ steps.process_checkout.outputs.path }}
          target_branch: ${{ env.TARGET_BRANCH }}
          owner: ${{ env.org_name }}
          repo: ${{ env.repo_name }}
          pr_number: ${{ atomgit.event.pull_request.number }}
          git_token: ${{ secrets.GIT_TOKEN }}
      -
        name: oidc_auth
        uses: huaweicloud-oidc-auth
        with:
          audience: ${{ secrets.audience }}
          agency_urn: ${{ secrets.agency_urn }}
          provider_urn: ${{ secrets.provider_urn }}
          region: cn-north-4
          duration: 3600
      -
        name: upload
        uses: obs-upload
        with:
          endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
          bucket: "ascend-ci"
          artifact-path: |
            ${{ steps.process_checkout.outputs.path }}/pr_filelist.txt
            ${{ steps.process_checkout.outputs.path }}/pr_filelist_mod.txt
            ${{ steps.process_checkout.outputs.path }}/pr_filelist_precommit.txt
            ${{ steps.process_checkout.outputs.path }}/update_file_detail.txt
            ${{ steps.process_checkout.outputs.path }}/gitdiff.txt
          object-prefix: ${{ env.obs_path }}/
    runs-on: ["self-hosted", "arch=x64", "spec=slim"]
    container:
      image: swr.cn-north-4.myhuaweicloud.com/ci_cann/ubuntu20.04.05_x86:k8s_v1.1006
  JOB_shell:
    permissions:
      repository: read
      id-token: write
    name: PreBuild_upload-scripts
    steps:
      -
        name: Checkout
        identifier: process_checkout
        uses: checkout
        with:
          ref: master
          token: ${{ secrets.GIT_TOKEN }}
      -
        name: oidc_auth
        uses: huaweicloud-oidc-auth
        with:
          audience: ${{ secrets.audience }}
          agency_urn: ${{ secrets.agency_urn }}
          provider_urn: ${{ secrets.provider_urn }}
          region: cn-north-4
          duration: 3600
      -
        name: upload
        uses: obs-upload
        with:
          endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
          bucket: "ascend-ci"
          artifact-path: |
            ${{ steps.process_checkout.outputs.path }}/.gitcode/scripts/*
          object-prefix: ${{ env.obs_path }}/
      -
        name: specify_scripts
        identifier: specify_scripts
        if: contains(atomgit.event.comment.body, '@')
        uses: cann/.gitcode/actions/specify_scripts@master
        with:
          repo_name: ${{ env.repo_name }}
          comment: ${{ atomgit.event.comment.body }}
          token: ${{ secrets.TESTTOKEN }}
          endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
          bucket: "ascend-ci"
          object-prefix: ${{ env.obs_path }}/
    runs-on: ["self-hosted", "arch=x64", "spec=slim"]
    container:
      image: swr.cn-north-4.myhuaweicloud.com/ci_cann/ubuntu20.04.05_x86:k8s_v1.1006
  JOB_pre:
    name: PreBuild_pipeline
    steps:
      - name: pre_pipeline
        uses: cann/.gitcode/actions/pre-pipeline@master
        with:
          owner: ${{ env.org_name }}
          repo: ${{ env.repo_name }}
          pr_number: ${{ atomgit.event.pull_request.number }}
          token: ${{ secrets.GIT_TOKEN }}
          apply_label: ${{ vars.APPLY_LABEL }}
          run_url: https://gitcode.com/${{ env.org_name }}/${{ env.repo_name }}/actions/runs/${{ atomgit.workflow_run_id }}
          actor: ${{ atomgit.actor }}
          pr_author: ${{ atomgit.event.pull_request.user.login }}
      - name: associate-pr-comment
        uses: associate-pr-comment
        if: env.online == 'true'
    runs-on: ["self-hosted", "arch=x64", "spec=slim"]
    container:
      image: swr.cn-north-4.myhuaweicloud.com/ci_cann/ubuntu20.04.05_x86:k8s_v1.1006
