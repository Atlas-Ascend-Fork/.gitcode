name: Question|问题咨询
description: 如果您需要咨询或者讨论问题，请使用此模板。
title: "[Question|问题咨询]: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提出问题，我们将安排人答复！
        Welcome to ask questions and discuss with other members.
  - type: textarea
    attributes:
      label: 问题描述 / Question Description (Mandatory / 必填)
      description: 请详细描述您的问题
      placeholder: 请尽可能详细地描述您的问题，包括上下文和已尝试的方法
    validations:
      required: true
  - type: textarea
    attributes:
      label: 环境信息 / Environment (Optional / 选填)
      description: 如果问题与环境相关，请提供环境信息
      placeholder: |
        - 昇腾硬件型号
        - CANN 版本
        - 操作系统
        - 框架版本
  - type: textarea
    attributes:
      label: 已尝试的方法 / Attempts Made (Optional / 选填)
      description: 请描述您已经尝试过的方法
      placeholder: 列出您已经尝试的解决方案或排查步骤
  - type: dropdown
    attributes:
      label: 问题类型 / Question Type (Optional / 选填)
      description: 问题属于哪类
      options:
        - "使用问题 / Usage"
        - "API 咨询 / API"
        - "性能问题 / Performance"
        - "文档问题 / Documentation"
        - "最佳实践 / Best Practice"
        - "其他 / Other"
