name: "Help-Wanted|任务认领"
description: 适用于社区开发者认领的功能开发、Bug修复或性能优化任务
title: "[Help-Wanted|任务认领]: "
labels: ["help wanted"]
body:
  - type: markdown
    attributes:
      value: |
        感谢您关注 CANN 项目！
        在开始认领任务前，请确保您已经阅读了本项目的贡献指南。
  - type: input
    id: task_title
    attributes:
      label: 任务标题 / Task Title (Mandatory / 必填)
      description: 用一句话概括这个任务
      placeholder: 例如：实现 AllGather 算子优化
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: 任务背景 / Background (Mandatory / 必填)
      description: 请说明任务的具体内容、背景和目的
      placeholder: 描述需要完成的工作，以及为什么它很重要...
    validations:
      required: false
  - type: textarea
    id: goal
    attributes:
      label: 任务目标 / Goals (Mandatory / 必填)
      description: 请列出要实现的具体功能点与目标
      placeholder: |
        1. 增加XXX功能
        2. 实现XXX特性
        3. 编写单元测试
        4. 性能达到XXX
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: 验收标准 / Acceptance Criteria (Optional / 选填)
      description: 任务完成需要满足哪些条件？
      placeholder: |
        - [ ] 功能正确性验证
        - [ ] 性能达标
        - [ ] 单元测试覆盖
        - [ ] 文档更新
      value: "- [ ] \n- [ ] \n- [ ] "
  - type: textarea
    id: resources
    attributes:
      label: 参考资料 / Resources (Optional / 选填)
      description: 相关的文档、代码位置、设计稿或外部链接
      placeholder: |
        - 相关代码文件：src/xxx.cc
        - 参考文档链接
        - 相关 Issue 链接
  - type: dropdown
    id: difficulty
    attributes:
      label: 难度级别 / Difficulty Level (Mandatory / 必填)
      description: 适合什么样的贡献者？
      options:
        - "新手友好 / Beginner Friendly"
        - "中等难度 / Intermediate"
        - "高级挑战 / Advanced"
        - "专家级 / Expert"
    default: 0
    validations:
      required: true
  - type: dropdown
    id: task_type
    attributes:
      label: 任务类型 / Task Type (Mandatory / 必填)
      description: 该任务属于什么类型
      options:
        - "算子开发 / Operator Development"
        - "算子优化 / Operator Optimization"
        - "通信功能 / Communication"
        - "Bug 修复 / Bug Fix"
        - "性能优化 / Performance"
        - "文档完善 / Documentation"
        - "测试开发 / Testing"
        - "其他 / Other"
    validations:
      required: false
  - type: input
    id: mentor
    attributes:
      label: 指导者 / Mentor (Optional / 选填)
      description: 如果指定了指导者，可以在此填写其 GitCode 用户名
      placeholder: "@username"
  - type: textarea
    attributes:
      label: 备注 / Additional Notes (Optional / 选填)
      description: 其他补充信息
