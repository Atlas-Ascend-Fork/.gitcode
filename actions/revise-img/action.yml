name: 'revise-img'
author: 'CANN'
version: '1.0.0'
description: 'this is a revise img action'
inputs:
  repo_name:
    required: true
  target_branch:
    required: true
  repo_url:
    description: 形式1使用——ci仓库地址（不切换仓/分支时传入）
    required: false
    default: "https://gitcode.com/cann/.gitcode.git"
  comment:
    description: 形式2使用——触发评论正文，action 从中解析 @后的分支并切换到内部 ci 仓库
    required: false
    default: ""
  token:
    description: 形式2使用——拉取私有 ci 仓库的 git token
    required: false
    default: ""

runs:
  using: 'node16'
  main: 'dist/main.js'