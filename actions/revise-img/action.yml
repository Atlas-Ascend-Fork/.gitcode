name: 'revise-img'
author: 'CANN'
version: '1.0.0'
description: 'this is a revise img action'
inputs:
  repo_name:
    required: true
  target_branch:
    required: true
  repo_url:
    description: ci仓库地址
    required: false
    default: "https://gitcode.com/cann/.gitcode.git"
  ci_branch:
    description: 指定拉取ci仓库的分支，为空时拉取默认分支
    required: false
    default: ""

runs:
  using: 'node16'
  main: 'dist/main.js'