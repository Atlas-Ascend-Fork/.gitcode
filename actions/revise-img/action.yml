name: 'revise-img'
author: 'CANN'
version: '1.0.0'
description: 'this is a revise img action'
inputs:
  repo_name:
    required: true
  target_branch:
    required: true
  repo_url:
    description: ci仓库地址
    required: false
    default: "https://gitcode.com/cann/.gitcode.git"
  ci_branch:
    description: 指定拉取ci仓库的分支，为空时从 comment 自动解析 @后的值
    required: false
    default: ""
  comment:
    description: 触发评论正文，用于自动解析 ci_branch；为空时读取环境变量 comment
    required: false
    default: ""
  token:
    description: 用于拉取私有 ci 仓库的 git token（仅 ci_branch 非空时使用）
    required: false
    default: ""

runs:
  using: 'node16'
  main: 'dist/main.js'