name: 'check-pr'
author: 'CANN'
version: '1.1.0'
description: 'this is a check pr filelist action'
inputs:
  workspace:
    description: 代码检出目录
    required: true
  repo_name:
    description: 仓库名称
    required: true
  target_branch:
    required: false
    default: 'master'
  pr_number:
    description: 触发检测的PR号，用于匹配放通名单（pr_skip_list.txt）
    required: false
    default: ''
  git_token:
    description: 私有仓库访问token，用于check_linked_issue查询PR关联issue
    required: false
    default: ''
  pr_issue:
    description: 仓库配置变量，为true时开启PR关联issue检测，未配置或false跳过
    required: false
    default: ''
  agent_hub_token:
    description: agent-hub认证token，用于触发AI泄密扫描pr_secret_scan.sh（仅opbase/ops-nn/ops-cv/ops-math/ops-ras/cannbot-skills仓启用泄密扫描时需要）
    required: false
    default: ''
  agent_hub_url:
    description: agent-hub服务地址，用于触发AI泄密扫描
    required: false
    default: 'https://cannbot.hicann.cn/agent-hub'

runs:
  using: 'node16'
  main: 'dist/main.js'