name: 'check-pr'
author: 'CANN'
version: '1.0.0'
description: 'this is a check pr filelist action'
inputs:
  workspace:
    description: 代码检出目录
    required: true
  repo_name:
    description: 仓库名称
    required: true
  target_branch:
    required: false
    default: 'master'
  obs_ak:
    description: OBS Access Key（门禁日志留档上传用，为空则跳过上传）
    required: false
    default: ''
  obs_sk:
    description: OBS Secret Key（门禁日志留档上传用，为空则跳过上传）
    required: false
    default: ''
  obs_gate_prefix:
    description: 门禁日志 OBS 留档前缀（按日期目录归档）
    required: false
    default: 'CANN/oss_dep_check'
  obs_endpoint:
    description: OBS endpoint
    required: false
    default: 'https://obs.cn-north-4.myhuaweicloud.com'
  obs_bucket:
    description: OBS bucket
    required: false
    default: 'ascend-ci'

runs:
  using: 'node16'
  main: 'dist/main.js'