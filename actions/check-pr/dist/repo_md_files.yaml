# 屏蔽路径配置：仓名 -> 分支 -> 路径列表
# common 对所有仓、所有分支生效
# '*' 为默认名单：目标分支为 master 或未配置该分支时使用
# 配置了具体分支（非 master）时，仅使用该分支的名单，不再合并 '*'
