name: 'get-pr'
author: 'CANN'
version: '1.1.0'
description: 'this is a get pr filelist action'
inputs:
  workspace:
    required: true
  target_branch:
    required: true
  commit:
    description: 指定 commit SHA，用于与 target_branch 做冲突检测
    required: false
  git_token:
    description: 私有仓库访问token，公开仓库无需传入
    required: false


runs:
  using: 'node16'
  main: 'dist/main.js'