name: 'api-check'
author: 'CANN'
version: '1.0.0'
description: 'API 文档生成上报与 PR 接口校验'
inputs:
  org_name:
    description: 组织名称，全局必填
    required: true
  mode:
    description: 执行模式：compile（API文档生成上报）或 check（PR接口校验）
    required: true
  repo_name:
    description: 仓库名称
    required: false
  merge_id:
    description: PR/MERGE编号
    required: false
  workspace:
    description: 代码工作目录，compile模式必填
    required: false
  source_branch:
    description: PR源分支，compile模式必填
    required: false
  target_branch:
    description: PR目标分支，compile模式必填
    required: false


runs:
  using: 'node16'
  main: 'dist/main.js'
