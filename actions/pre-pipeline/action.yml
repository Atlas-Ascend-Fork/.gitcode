name: 'pre-pipeline'
author: 'CANN'
version: '1.1.0'
description: '流水线开始前给 PR 打上 ci-pipeline-running 标签, 并发布流水线链接评论'
inputs:
  owner:
    description: '仓库所属组织/用户'
    required: true
  repo:
    description: '仓库名称'
    required: true
  pr_number:
    description: 'PR 编号'
    required: true
  token:
    description: 'GitCode 个人访问令牌'
    required: true
  apply_label:
    description: '是否执行打标签逻辑'
    required: false
    default: 'false'
  run_url:
    description: '当前流水线运行链接, 传入则在 PR 评论区发布流水线链接评论'
    required: false
    default: ''

runs:
  using: 'node16'
  main: 'dist/main.js'
